openapi: 3.1.0
info:
  title: stutzthings-server Device Operations API
  version: 0.1.0
  description: |
    Planned REST contract for device state reads, history reads, desired-state writes,
    and stateless device registration using the same JWT claim model as Mosquitto.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /registration:
    post:
      summary: Register a new device instance
      description: Requires a bearer JWT whose wildcard `publ` and `subs` filters cover the requested account/device namespace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Device instance registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{account_id}/{device_id}/{device_instance_id}:
    get:
      summary: Read latest device state
      description: Authorized when each returned telemetry topic matches at least one filter in the caller's `publ` or `subs` claim. An authorized empty result returns `attributes=[]`, `isPartial=false`, and `excludedAttributeCount=0`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceInstanceId'
      responses:
        '200':
          description: Current device snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{account_id}/{device_id}/{device_instance_id}/{node_name}/{attribute_name}:
    get:
      summary: Read latest attribute state
      description: Authorized when the addressed telemetry topic matches at least one filter in the caller's `publ` or `subs` claim. An authorized empty result returns `found=false` and `observation=null`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceInstanceId'
        - $ref: '#/components/parameters/NodeName'
        - $ref: '#/components/parameters/AttributeName'
      responses:
        '200':
          description: Latest attribute observation or empty result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Publish desired state for an attribute
      description: Authorized when the addressed `/set` topic matches at least one filter in the caller's `subs` claim.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceInstanceId'
        - $ref: '#/components/parameters/NodeName'
        - $ref: '#/components/parameters/AttributeName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesiredStateRequest'
      responses:
        '202':
          description: Desired-state command accepted for publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesiredStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{account_id}/{device_id}/{device_instance_id}/{node_name}/history:
    get:
      summary: Read node history
      description: Authorized when the addressed telemetry topics match at least one filter in the caller's `publ` or `subs` claim. Results are ordered by `observedAt` ascending; equal timestamps are secondarily ordered by `nodeName`, `attributeName`, and canonical value string. Empty successful reads return `observations=[]`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceInstanceId'
        - $ref: '#/components/parameters/NodeName'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: History result for all authorized attributes under the node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /{account_id}/{device_id}/{device_instance_id}/{node_name}/{attribute_name}/history:
    get:
      summary: Read attribute history
      description: Authorized when the addressed telemetry topic matches at least one filter in the caller's `publ` or `subs` claim. Results are ordered by `observedAt` ascending; equal timestamps are secondarily ordered by canonical value string. Empty successful reads return `observations=[]`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceInstanceId'
        - $ref: '#/components/parameters/NodeName'
        - $ref: '#/components/parameters/AttributeName'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: History result for the attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }
    DeviceInstanceId:
      name: device_instance_id
      in: path
      required: true
      schema: { type: string }
    NodeName:
      name: node_name
      in: path
      required: true
      schema: { type: string }
    AttributeName:
      name: attribute_name
      in: path
      required: true
      schema: { type: string }
    FromTimestamp:
      name: from
      in: query
      required: true
      description: Inclusive lower time bound in RFC3339 UTC format.
      schema:
        type: string
        format: date-time
    ToTimestamp:
      name: to
      in: query
      required: true
      description: Exclusive upper time bound in RFC3339 UTC format.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Token does not authorize the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ScalarValue:
      anyOf:
        - type: number
        - type: string
        - type: boolean
    TopicFilterList:
      type: array
      items:
        type: string
    Observation:
      type: object
      required: [accountId, deviceId, deviceInstanceId, nodeName, attributeName, observedAt, value]
      properties:
        accountId: { type: string }
        deviceId: { type: string }
        deviceInstanceId: { type: string }
        nodeName: { type: string }
        attributeName: { type: string }
        observedAt:
          type: string
          format: date-time
        value:
          $ref: '#/components/schemas/ScalarValue'
    AttributeStateResponse:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        observation:
          oneOf:
            - $ref: '#/components/schemas/Observation'
            - type: 'null'
    DeviceStateResponse:
      type: object
      required: [accountId, deviceId, deviceInstanceId, isPartial, excludedAttributeCount, attributes]
      properties:
        accountId: { type: string }
        deviceId: { type: string }
        deviceInstanceId: { type: string }
        isPartial: { type: boolean }
        excludedAttributeCount:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
    HistoryResponse:
      type: object
      required: [from, to, observations]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        observations:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Observation'
    DesiredStateRequest:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/ScalarValue'
    DesiredStateResponse:
      type: object
      required: [accepted, topic]
      properties:
        accepted: { type: boolean }
        topic: { type: string }
    RegistrationRequest:
      type: object
      required: [accountId, deviceId]
      properties:
        accountId: { type: string }
        deviceId: { type: string }
    RegistrationResponse:
      type: object
      required: [accountId, deviceId, deviceInstanceId, sub, publ, subs, iss, issuedAt, expiresAt, token]
      properties:
        accountId: { type: string }
        deviceId: { type: string }
        deviceInstanceId: { type: string }
        sub: { type: string }
        publ:
          $ref: '#/components/schemas/TopicFilterList'
        subs:
          $ref: '#/components/schemas/TopicFilterList'
        iss: { type: string }
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        token: { type: string }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_input, window_too_large, unauthorized, forbidden, backend_failure]
        message: { type: string }