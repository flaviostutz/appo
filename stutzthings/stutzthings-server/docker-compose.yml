services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: stutzthings-mosquitto
    environment:
      JWT_SIGNING_SECRET_BASE64: ${JWT_SIGNING_SECRET_BASE64:-ZGV2X2p3dF9zZWNyZXRfbG9jYWxfb25seV9wbGVhc2VfY2hhbmdl}
    command:
      - /bin/sh
      - -ec
      - |
        cat >/mosquitto/config/mosquitto.conf <<'EOF'
        listener 1883
        allow_anonymous false
        auth_plugin /mosquitto/auth/libmosquitto_jwt_auth.so
        auth_opt_jwt_alg HS256
        auth_opt_jwt_sec_env JWT_SIGNING_SECRET_BASE64
        auth_opt_jwt_validate_exp true
        auth_opt_jwt_validate_sub_match_username true
        persistence false
        EOF
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      - ${MOSQUITTO_JWT_AUTH_SO:?set MOSQUITTO_JWT_AUTH_SO}:/mosquitto/auth/libmosquitto_jwt_auth.so:ro

  influxdb:
    image: influxdb:3-core
    container_name: stutzthings-influxdb3
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8086
      - --admin-token-file=/run/secrets/admin-token
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb3-data:/var/lib/influxdb3/data
      - ./.docker/influxdb/admin-token.json:/run/secrets/admin-token:ro
