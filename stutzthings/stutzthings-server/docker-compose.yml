services:
  mosquitto:
    image: nn-docker.artifactory.insim.biz/eclipse-mosquitto:2
    command:
      - /bin/sh
      - -ec
      - |
        cat >/mosquitto/config/mosquitto.conf <<'EOF'
        listener 1883
        allow_anonymous false
        auth_plugin /mosquitto/auth/libmosquitto_jwt_auth.so
        auth_opt_jwt_alg HS256
        auth_opt_jwt_sec_env ZGV2X2p3dF9zZWNyZXRfbG9jYWxfb25seV9wbGVhc2VfY2hhbmdl
        auth_opt_jwt_validate_exp true
        auth_opt_jwt_validate_sub_match_username true
        persistence false
        EOF
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"

  influxdb:
    image: nn-docker.artifactory.insim.biz/influxdb:3-core
    command:
      - /bin/sh
      - -ec
      - |
        cat > /var/lib/influxdb3/admin-token.json <<'EOF'
        {"token":"apiv3_dev_token_local_only","name":"admin","description":"Local development token for stutzthings-server"}
        EOF
        exec influxdb3 serve \
          --node-id=node0 \
          --object-store=file \
          --data-dir=/var/lib/influxdb3/data \
          --http-bind=0.0.0.0:8086 \
          --admin-token-file=/var/lib/influxdb3/admin-token.json
    ports:
      - "8086:8086"
    volumes:
      - ./.docker/influxdb3-data:/var/lib/influxdb3/data
