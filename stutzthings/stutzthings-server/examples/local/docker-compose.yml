services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: stutzthings-local-mosquitto
    environment:
      JWT_SIGNING_SECRET_BASE64: ${JWT_SIGNING_SECRET_BASE64:-ZGV2X2p3dF9zZWNyZXRfbG9jYWxfb25seV9wbGVhc2VfY2hhbmdl}
    command:
      - mosquitto
      - -c
      - /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      - ./.data/mosquitto:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MOSQUITTO_JWT_AUTH_SO:?set MOSQUITTO_JWT_AUTH_SO}:/mosquitto/auth/libmosquitto_jwt_auth.so:ro

  influxdb:
    image: influxdb:3-core
    container_name: stutzthings-local-influxdb3
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8086
      - --admin-token-file=/run/secrets/admin-token
    ports:
      - "8086:8086"
    volumes:
      - ./.data/influxdb3:/var/lib/influxdb3/data
      - ./influxdb/admin-token.json:/run/secrets/admin-token:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: stutzthings-local-grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - ./.data/grafana/data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro